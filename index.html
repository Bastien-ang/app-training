<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entraînement"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12171B"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><title>PROGRAMME D'ENTRAÎNEMENT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--bg:#12171B;--ridge:#0D1114;--panel:#1C2328;--panel2:#161B1F;--line:#2E373D;--snow:#EEF1F0;--fog:#8FA0A8;--rust:#C1531E;--glacier:#5A93A8;--moss:#5C8253;--ember:#B23A34;--night:#232C31;--sun:#E0A93B;--glass:rgba(22,28,33,.58);--glass2:rgba(10,14,17,.5);--gb:rgba(255,255,255,.09);color-scheme:dark;--display:'Anton','Arial Narrow',Impact,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--snow)}
body{font-family:var(--sans);min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%;font-size:15px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.d{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-transform:uppercase}
.m{font-family:var(--mono)}
.sub{font-size:11px;color:var(--fog)}
.mono-s{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--fog);text-transform:uppercase}
.rust{color:var(--rust)}.gl{color:var(--glacier)}.mo{color:var(--moss)}.em{color:var(--ember)}.sun{color:var(--sun)}.fog{color:var(--fog)}
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(18,23,27,.88) 0%,rgba(18,23,27,.6) 32%,rgba(13,17,20,.78) 70%,rgba(13,17,20,.92) 100%),var(--photo) center 66%/cover no-repeat,linear-gradient(180deg,#1d2b36 0%,#0d1114 100%)}
#bg:after{content:"";position:absolute;top:-8%;right:4%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(193,83,30,.22) 0%,transparent 70%)}
#shell{position:relative;z-index:1;display:flex;min-height:100dvh}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:rgba(12,16,19,.8);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--gb)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border:0;background:none;color:var(--fog);font-size:10px;font-weight:500;border-radius:8px}
.nb.on{color:var(--snow)}.nb.on svg{color:var(--rust)}
.brand{display:none}
#main{flex:1;min-width:0;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--glass2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--gb)}
#top h1{margin:0;font-size:1.25rem;line-height:1.05;cursor:pointer}
#sv{font-family:var(--mono);font-size:10px;color:var(--fog);white-space:nowrap}
#sv.ok{color:var(--moss)}
#view{padding:16px;max-width:880px;margin:0 auto}
@media(min-width:900px){
#nav{position:sticky;top:0;height:100dvh;width:228px;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--gb)}
.brand{display:flex;align-items:center;gap:8px;padding:6px 12px 18px;color:var(--rust);font-family:var(--mono);font-size:11px;letter-spacing:.18em}
.nb{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;justify-content:flex-start}
.nb.on{background:rgba(255,255,255,.07)}
#main{padding-bottom:40px}
#top h1{font-size:1.6rem}
}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gb);border-radius:14px;padding:14px;margin-bottom:12px}
.card.acc{border-left:3px solid var(--acc,var(--glacier))}
.card h3{margin:0 0 6px;font-size:16px;font-weight:600}
.card h2{margin:0 0 8px}
.sec{margin:22px 2px 8px;display:flex;align-items:center;gap:8px}
.sec h2{margin:0;font-size:1.15rem}
.row{display:flex;align-items:center;gap:10px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.g4{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--gb);border-radius:14px;padding:12px;text-align:center}
.tile .v{font-family:var(--display);font-size:1.6rem;color:var(--rust);line-height:1.1}
.tile .v small{font-family:var(--sans);font-size:.7rem;color:var(--fog);margin-left:2px}
.tile .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;color:var(--fog);text-transform:uppercase;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:0;border-radius:10px;background:var(--rust);color:#fff;font-weight:600;font-size:14px}
.btn.gl{background:var(--glacier);color:#0b1114}.btn.mo{background:var(--moss);color:#fff}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--snow);border:1px solid var(--gb)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.full{width:100%}
.btn:active{transform:scale(.98);opacity:.9}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--gb);background:rgba(255,255,255,.05);color:var(--snow);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--c,var(--rust));border-color:var(--c,var(--rust));color:#0b1114;font-weight:700}
.inp,.sel{width:100%;background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:16px;outline:0;color:var(--snow)}
.inp:focus,.sel:focus{border-color:var(--glacier)}
.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fog) 50%),linear-gradient(135deg,var(--fog) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.sel.s{font-size:12px;padding:6px 26px 6px 8px;color:var(--fog);max-width:100%}
.lab{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--fog);text-transform:uppercase;margin:0 0 4px}
.badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:5px;font-weight:700;background:var(--c,var(--glacier));color:#0b1114}
.badge.o{background:transparent;border:1px solid var(--c,var(--fog));color:var(--c,var(--fog))}
.hero{width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--acc);border-left:4px solid var(--acc);margin-bottom:12px;color:var(--snow)}
.hero .ic{width:46px;height:46px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#0b1114;flex:none}
.hero .t{font-family:var(--display);font-size:1.12rem;text-transform:uppercase;line-height:1.15}
.ins{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--gb);font-size:13.5px}
.ins:last-child{border-bottom:0}.ins svg{flex:none;margin-top:1px}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c,var(--rust))}
.bar>b{position:absolute;top:0;bottom:0;background:rgba(92,130,83,.35);border-left:1px solid rgba(92,130,83,.8);border-right:1px solid rgba(92,130,83,.8)}
.ex{border-top:1px solid var(--gb);padding:12px 0}
.ex:first-of-type{border-top:0}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.ex-n{font-weight:600;font-size:15px}
.ex .sel.s{max-width:170px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:6px;align-items:center;margin-bottom:7px}
.set.t{grid-template-columns:22px 1fr 44px}
.set .sn{font-family:var(--mono);font-size:11px;color:var(--fog);text-align:center}
.set .st{font-family:var(--mono);font-size:11.5px;color:var(--fog)}
.set .inp{padding:8px 4px;text-align:center}
.chk{height:44px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--fog);display:grid;place-items:center}
.set.on .chk,.single.on .chk{background:var(--moss);border-color:var(--moss);color:#fff}
.set.on .inp{border-color:rgba(92,130,83,.6)}
.single{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.single .fs{display:flex;gap:6px}
.single .inp{width:84px;text-align:center;padding:8px 4px}
.xf{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pr{color:var(--sun);font-weight:700}
.rd{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.rd .lb{width:92px;font-size:12px;color:var(--fog)}
.rd .opts{display:flex;gap:5px;flex:1}
.rd button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:13px;color:var(--fog)}
.rd button.on{background:var(--glacier);border-color:var(--glacier);color:#0b1114;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--fog)}
.cd{aspect-ratio:1/1.05;border-radius:9px;border:1px solid transparent;background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fog);font-size:12px;position:relative;padding:0}
.cd.today{border-color:var(--fog);color:var(--snow)}
.cd.sel{border-color:var(--rust)}
.cd .pd{width:6px;height:6px;border-radius:50%}
.cd .ck{position:absolute;top:2px;right:3px;color:var(--moss)}
.cd .ms{display:flex;gap:2px;height:4px}.cd .ms i{width:4px;height:4px;border-radius:50%}
.cd.miss .pd{opacity:.3}
.wk{display:flex;gap:4px}
.wk button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--fog);font-family:var(--mono);font-size:10px}
.wk button.today{background:rgba(255,255,255,.07);color:var(--snow)}
.wk button.sel{border-color:var(--rust)}
.wk i{width:9px;height:9px;border-radius:50%;display:block}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--fog);margin-top:6px}
.leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:8px;height:8px;border-radius:2px;display:block}
.ls{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gb);font-size:13.5px}
.ls:last-child{border-bottom:0}
.ls .x{background:none;border:0;color:var(--fog);padding:4px}
svg text{font-family:var(--mono)}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(10,14,17,.92);border:1px solid var(--rust);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
#timer.on{display:flex}
#timer .tt{font-family:var(--mono);font-size:20px;font-weight:700;min-width:54px;text-align:center}
#timer button{border:1px solid var(--gb);background:rgba(255,255,255,.07);color:var(--snow);border-radius:999px;padding:6px 10px;font-size:12px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:90;background:rgba(10,14,17,.95);border:1px solid var(--gb);color:var(--snow);padding:10px 16px;border-radius:12px;font-size:13px;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;width:52px;height:52px;border-radius:50%;border:0;background:var(--rust);color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}
@media(min-width:900px){#fab{bottom:20px;right:20px}#timer{bottom:24px}}
#chat{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;background:rgba(12,16,19,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#chat.on{display:flex}
@media(min-width:620px){#chat{inset:auto 20px 20px auto;width:400px;height:620px;max-height:calc(100dvh - 40px);border-radius:16px;border:1px solid var(--gb)}}
#chat .ch{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--gb)}
#chat .cb{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
#chat .cf{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--gb)}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;line-height:1.4}
.msg.u{align-self:flex-end;background:var(--rust);color:#fff}
.msg.a{align-self:flex-start;background:rgba(255,255,255,.07)}
.fatal{margin:16px;padding:14px;border:1px solid var(--ember);border-radius:12px;background:rgba(178,58,52,.15);font-size:13px;white-space:pre-wrap}
details summary{cursor:pointer;color:var(--fog);font-size:13px;padding:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--fog);text-align:left;padding:6px 4px;text-transform:uppercase;font-weight:500}
table.t td{padding:7px 4px;border-top:1px solid var(--gb)}
table.t tr.cur td{background:rgba(193,83,30,.12)}
.hide{display:none!important}
.fig{display:block;width:100%;aspect-ratio:100/94;background:linear-gradient(180deg,#27303a,#151a1e);border-radius:12px}
.fig .dc{stroke:#6c7c87;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fig .fl,.fig .ft,.fig .fa,.fig .fg{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .fl{stroke:#c9d3d1;stroke-width:4.6}
.fig .ft{stroke:var(--snow);stroke-width:6.4}
.fig .fa{stroke:#e8eeed;stroke-width:3.8}
.fig .fg{stroke:#8fa3ad;stroke-width:3;opacity:.2}
.fig .hm{fill:var(--rust);opacity:.6;mix-blend-mode:normal;animation:hmp 1.3s ease-in-out infinite alternate}
@keyframes hmp{from{opacity:.25}to{opacity:.75}}
.phs{font-size:.74rem;color:var(--fog);margin-bottom:6px;line-height:1.35}.phs b{color:var(--snow)}
details.tip{margin-top:8px;font-size:.78rem}details.tip summary{cursor:pointer;color:var(--rust);font-weight:600;list-style:none}details.tip summary::-webkit-details-marker{display:none}details.tip summary:before{content:'⚙ '}details.tip ul{margin:6px 0 0;padding-left:16px;color:var(--fog);line-height:1.4}details.tip li{margin-bottom:4px}
.fig .b{stroke-linejoin:round}.fig .b{stroke:rgba(0,0,0,.35);stroke-width:.45}.fig .b-tor{fill:url(#gShirt);stroke:url(#gShirt)}.fig .b-lgt{fill:url(#gShort)}.fig .b-lg2t{fill:url(#gShortD)}.fig .b-lgs,.fig .b-hd,.fig .b-fa,.fig .b-ua,.fig .b-nk{fill:url(#gSkin)}.fig .b-lg2s,.fig .b-hd2,.fig .b-fa2,.fig .b-ua2{fill:url(#gSkinD)}.fig .b-lgf{fill:url(#gShoe)}.fig .b-lg2f{fill:#b9c1c4}
.fig .shd{fill:rgba(0,0,0,.4)}
.fig .c1,.fig .c2{fill:#1b2126;stroke:#a5b1b8;stroke-width:1.5}
.fig .e1,.fig .e2{stroke:#b4bec4;stroke-width:1.4;fill:none}
.fig .fh{fill:url(#gSkin);stroke:rgba(0,0,0,.3);stroke-width:.4}.fig .hr{fill:#3a2f2a}
.fig .fe{stroke:var(--rust);fill:rgba(193,83,30,.35);stroke-width:2.2;stroke-linecap:round}
.fig .e1,.fig .e2{fill:none}
.exfig{width:84px;flex:none;border:0;padding:0;background:none;position:relative}
.exfig .hint{position:absolute;right:4px;bottom:4px;font-size:9px;font-family:var(--mono);color:var(--fog)}
#modal{position:fixed;inset:0;z-index:95;display:none;background:rgba(8,11,13,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow-y:auto}
#modal.on{display:block}
#modal .mi{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 40px}
.vr{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--gb);border-radius:12px;margin-bottom:10px;background:var(--glass)}
.vr.cur{border-color:var(--rust)}
#dlg{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,11,13,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#dlg.on{display:flex}
#dlg .dbox{max-width:360px;width:100%;background:var(--panel);border:1px solid var(--gb);border-radius:14px;padding:18px}
#dlg p{margin:0 0 16px;font-size:15px}

.obj{font-size:.78rem;color:var(--fog);margin-top:6px;line-height:1.35}
details.tip li b{color:var(--snow)}

.ssg{border-left:3px solid var(--rust);padding-left:8px;margin:10px 0;background:rgba(193,83,30,.06);border-radius:10px}
.ssh{font-size:.7rem;font-family:var(--mono);color:var(--rust);margin:8px 0 2px;letter-spacing:.04em}
.ssb{display:block;margin:6px auto;font-size:.72rem;background:none;border:1px dashed var(--gb);color:var(--fog);border-radius:999px;padding:5px 12px;font-family:inherit}
.ssb.on{color:var(--rust);border-color:var(--rust);border-style:solid}
.ssbar{display:flex;gap:8px;align-items:center;margin:0 0 10px;padding:10px 12px;border:1px solid var(--gb);border-radius:12px;background:var(--glass)}

.stp{display:grid;grid-template-columns:34px 1fr 34px;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.32)}
.stp .inp{border:0;border-radius:0;background:transparent;padding:10px 2px;text-align:center;font-size:17px;font-weight:600;min-width:0}
.stp .sb{border:0;background:rgba(255,255,255,.07);color:var(--snow);font-size:20px;line-height:1;font-weight:500}
.stp .sb:active{background:var(--rust)}
.set.on .stp{border-color:rgba(92,130,83,.7)}
.set .st .pr{color:var(--sun)}
.xr{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.btn.big{padding:15px 14px;font-size:16px;border-radius:12px}
.ex.dn{border-left:3px solid var(--moss);padding-left:10px}
.ex.col .exbody{display:none}
.ex.col{padding:9px 0 9px 10px}
.exhd{text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit}
.chev{color:var(--fog);font-size:16px;padding:6px}
details.tip.info{margin:0 0 8px}
.pgs{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;margin:0 0 10px;padding:8px 12px;border:1px solid var(--gb);border-radius:12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDate=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);};
const today=()=>fmtDate(new Date());
const dowOf=s=>parseDate(s).getDay();
const dayId=s=>DAYIDS[dowOf(s)];
const mondayOf=s=>{const d=parseDate(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmtDate(d);};
const daysBetween=(a,b)=>Math.round((parseDate(b)-parseDate(a))/864e5);
const weeksBetween=(a,b)=>Math.floor(daysBetween(a,b)/7);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;};
const rnd=w=>Math.round(w*2)/2;
const fmtW=w=>(Math.round(w*10)/10).toString().replace('.',',');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.round(s);if(!isFinite(s)||s<0)s=0;return Math.floor(s/60)+':'+pad(s%60);};
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+'h'+pad(m)+'\''+pad(s%60);};
const parseT=v=>{v=String(v||'').trim().replace(',','.');if(!v)return 0;if(v.indexOf(':')>-1){const p=v.split(':').map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:(p[0]||0)*60+(p[1]||0);}return parseFloat(v)||0;};
const longDate=s=>{const d=parseDate(s);return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()].toLowerCase();};

/* ---- cycle / phases ---- */
const weekIdx=s=>Math.floor(daysBetween(EPOCH,mondayOf(s))/7);
const cycOf=s=>s>=V2?(((weeksBetween(V2,mondayOf(s)))%6)+6)%6:((weekIdx(s)%6)+6)%6;
function daysToRace(s){const r=S.set.race;if(!r)return null;return daysBetween(s||today(),r);}
const isTaper=s=>false;
const isDeload=s=>false;
function phaseOf(s){
 const n=daysToRace(s);
 if(n!==null&&n>=0){const w=n/7;if(w>16)return{n:'Bloc physique',c:'#5A93A8',d:'Hypertrophie d\'abord : tu construis le physique, le cardio reste en entretien actif.'};if(n<=7)return{n:'Affûtage',c:'#5C8253',d:'Volume réduit, intensité maintenue — arrive frais.'};if(w<=3)return{n:'Spécifique Hyrox',c:'#B23A34',d:'Allures et enchaînements de course.'};if(w<=8)return{n:'Construction',c:'#C1531E',d:'Charge de travail maximale du bloc.'};return{n:'Base',c:'#5A93A8',d:'Volume et technique, base aérobie.'};}
 const c=cycOf(s);if(s>=V2)return[{n:'Accumulation',c:'#5A93A8',d:'Volume en hausse, on construit.'},{n:'Accumulation',c:'#5A93A8',d:'Volume en hausse, on construit.'},{n:'Intensification',c:'#C1531E',d:'Charges plus lourdes, séries proches de l\'échec.'},{n:'Intensification',c:'#C1531E',d:'Charges plus lourdes, séries proches de l\'échec.'},{n:'Pic de volume',c:'#B23A34',d:'Semaine la plus chargée, simulation Hyrox.'},{n:'Décharge',c:'#5C8253',d:'Semaine allégée (−1 série, −10 % de charge) pour grossir en récupérant.'}][c];return[{n:'Accumulation',c:'#5A93A8',d:'Volume en hausse, intensité modérée.'},{n:'Accumulation',c:'#5A93A8',d:'Volume en hausse, intensité modérée.'},{n:'Intensification',c:'#C1531E',d:'Charges et allures plus exigeantes.'},{n:'Intensification',c:'#C1531E',d:'Charges et allures plus exigeantes.'},{n:'Spécifique',c:'#B23A34',d:'Séances proches du format Hyrox.'},{n:'Décharge',c:'#5C8253',d:'Semaine allégée (−1 série, −10 % de charge) pour consolider.'}][c];
}
const bodyKg=()=>S.weights.length?S.weights[S.weights.length-1].kg:76;

/* ---- exercices (variantes) ---- */
function resolve(id,variant){
 const b=EX[id];const it=Object.assign({},b);const v=variant||S.subs[id];
 if(v&&v!==b.name&&ALT[id]){const a=ALT[id].find(x=>x[0]===v);
  if(a){it.name=a[0];it.unit=a[2];if(a[3])it.cat=a[3];if(a[4])Object.assign(it,a[4]);
   if(b.kind==='station'){if(a[2]==='s'){it.tb=a[1];it.base=undefined;}else{it.base=a[1];}}
   else if(b.kind==='time'||b.kind==='check'){}
   else it.base=a[1];
   if(b.kind==='lift'||b.kind==='carry')it.inc=incFor(it.cat,it.unit);
   if(/assistance/.test(a[2]))it.assist=true;}}
 it.key=(b.lg||id)+'::'+it.name;it.id=id;return it;}
function altNames(id){return[EX[id].name].concat((ALT[id]||[]).map(a=>a[0]));}

/* ---- historique ---- */
const isDone=e=>!!e&&(e.sets?e.sets.some(s=>s.d):!!e.d);
function hist(){if(H)return H;H={};Object.keys(S.logs).sort().forEach(d=>{const L=S.logs[d];const add=(k,e)=>{(H[k]=H[k]||[]).push({date:d,e:e});};
 Object.keys(L.ex||{}).forEach(i=>{const e=L.ex[i];if(e.k)add(e.k,e);});if(L.run&&L.run.k)add(L.run.k,L.run);});return H;}
function lastEntry(key,D,skipDeload){const h=hist()[key]||[];for(let i=h.length-1;i>=0;i--){const x=h[i];if(x.date>=D)continue;if(skipDeload!==false&&isDeload(x.date))continue;if(isDone(x.e))return x;}return null;}
const getEx=(d,id)=>S.logs[d]&&S.logs[d].ex&&S.logs[d].ex[id];
function ensureEx(d,it){const L=S.logs[d]=S.logs[d]||{};L.ex=L.ex||{};let e=L.ex[it.id];if(!e){e=L.ex[it.id]={k:it.key,sets:[]};}return e;}

/* ---- cibles progressives ---- */
function liftTarget(it,D){
 const dir=it.assist?-1:1,r0=it.reps||[8,10],lo=r0[0],hi=r0[1];
 let w=it.base||0,r=lo,src='base';const le=lastEntry(it.key,D);
 if(le){const ds=(le.e.sets||[]).filter(s=>s.d&&num(s.r)>0);
  if(ds.length){const ws=ds.map(s=>num(s.w));const top=dir>0?Math.max.apply(null,ws):Math.min.apply(null,ws);
   const at=ds.filter(s=>num(s.w)===top);const mr=Math.min.apply(null,at.map(s=>num(s.r)));
   w=top;if(mr>=hi){w=top+dir*it.inc;r=lo;}else if(mr>=lo){r=Math.min(hi,mr+1);}
   src='last';const wa=Math.max(0,weeksBetween(le.date,D)-1);w+=dir*Math.floor(wa/2)*it.inc;}}
 else{const wa=Math.max(0,weeksBetween(today(),D));w=(it.base||0)+dir*Math.floor(wa/3)*it.inc;}
 if(isDeload(D)&&dir>0)w*=0.9;
 return{w:Math.max(0,rnd(w)),r:r,src:src,le:le};}
function timeTarget(it,D){const le=lastEntry(it.key,D);let t=it.base||30;if(le){const v=(le.e.sets||[]).filter(s=>s.d).map(s=>num(s.w));if(v.length)t=Math.max.apply(null,v)+5;}else{t+=5*Math.max(0,Math.floor(weeksBetween(today(),D)/2));}return{t:t,le:le};}
function loadTarget(it,D){const le=lastEntry(it.key,D);let w=it.base||0,t=it.tb||0;
 if(le){if(it.base!==undefined&&le.e.v!==undefined&&le.e.v!=='')w=num(le.e.v)+(le.e.d?it.inc||0:0);if(le.e.t)t=Math.max(10,parseT(le.e.t)-3);}
 else if(it.base!==undefined){w=it.base+(it.inc||0)*Math.max(0,Math.floor(weeksBetween(today(),D)/3));}
 return{w:rnd(w),t:t,le:le};}
function runItem(kind,D){if(kind==='wed')return wedPlan(D).run;const c=cycOf(D);const r=RUNC[kind][c];return Object.assign({id:'run-'+kind,key:'run::'+r.name,cyc:c,kind:kind},r);}
function runTarget(r,D){const le=lastEntry(r.key,D);let t=r.base*(S.set.paceF||1);
 if(le&&le.e.v){const l=parseT(le.e.v);if(l>0){const cy=Math.max(1,Math.floor(weeksBetween(le.date,D)/6));t=l-3*cy;}}
 else{t=t-3*Math.max(0,Math.floor(weeksBetween(EPOCH,D)/6));}
 return{t:Math.max(r.seg===1000?200:30,t),le:le};}

/* ---- adaptation (readiness) ---- */
function readyScore(d){const r=S.ready[d];if(!r||!r.sl)return null;const v=[r.sl,r.mu,r.en,r.me].filter(Boolean);return v.length===4?v.reduce((a,b)=>a+b,0)/4:null;}
function isLight(d){const s=readyScore(d);return S.set.adapt&&s!==null&&s<=2.5&&!(S.ready[d]&&S.ready[d].off);}
function setsFor(it,D){let n=it.sets||3;if(isDeload(D))n-=1;if(isLight(D))n-=1;if(isTaper(D))n=Math.round(n*.6);return Math.max(2,n);}

/* ---- records ---- */
const loadOf=(it,s)=>{const m=/haltère/.test(it.unit||'')?2:1;return num(s.w)*m+(it.bw?it.bw*bodyKg():0);};
const e1rm=(it,s)=>{const r=num(s.r);return r>0?loadOf(it,s)*(1+Math.min(r,12)/30):0;};
function prBest(it,beforeDate){let b=0;(hist()[it.key]||[]).forEach(x=>{if(beforeDate&&x.date>=beforeDate)return;(x.e.sets||[]).forEach(s=>{if(s.d)b=Math.max(b,e1rm(it,s));});});return b;}

/* ---- volume ---- */
const MUSCLE_TGT={Pecs:[10,18],Dos:[10,20],'Épaules':[8,18],Biceps:[6,14],Triceps:[6,14],Jambes:[10,20],Core:[6,12]};
function emptyVol(){const o={};MUSCLES.forEach(m=>o[m]=0);return o;}
function weekVolume(mon){
 const sets=emptyVol(),ton=emptyVol();let tonT=0,nSets=0;
 for(let i=0;i<7;i++){const d=addDays(mon,i),L=S.logs[d];
  if(L&&L.ex)Object.keys(L.ex).forEach(id=>{const meta=EX[id],e=L.ex[id];if(!meta||!meta.m||!e.sets)return;const vs=e.k?e.k.split('::')[1]:meta.name;const it=resolve(id,vs);
   const ms=[].concat(meta.m);e.sets.forEach(s=>{if(!s.d)return;nSets++;ms.forEach(m=>{sets[m]+=1;});(meta.s||[]).forEach(m=>{sets[m]+=.5;});
    if(it.kind==='lift'&&num(s.r)>0){const t=loadOf(it,s)*num(s.r);tonT+=t;ms.forEach(m=>{ton[m]+=t/ms.length;});}});});
  (S.acts[d]||[]).forEach(a=>{(a.ex||[]).forEach(x=>{if(!MUSCLES.includes(x.m))return;const n=num(x.sets)||1;sets[x.m]+=n;nSets+=n;const t=num(x.w)*num(x.reps)*n;ton[x.m]+=t;tonT+=t;});});}
 return{sets:sets,ton:ton,tonT:tonT,nSets:nSets};}
function plannedVolume(mon){const sets=emptyVol();
 ['lun','mar','mer','jeu','ven'].forEach((id,i)=>{const d=addDays(mon,i);if(S.skip[d])return;const P=progOf(d,id),SO=soirOf(P,d);if(!P||!SO)return;
  SO.blocks.forEach(b=>b.ex.forEach(x=>{const it=resolve(x);if(!it.m)return;const n=setsFor(it,d);[].concat(it.m).forEach(m=>{sets[m]+=n;});(it.s||[]).forEach(m=>{sets[m]+=n*.5;});}));});
 return sets;}

/* ---- charge d'entraînement (sRPE) ---- */
function dayLoad(d){let t=0;const L=S.logs[d]||{};if(L.fin)t+=num(L.fin.rpe)*num(L.fin.min);if(L.run&&L.run.fin)t+=num(L.run.rpe)*num(L.run.min);(S.acts[d]||[]).forEach(a=>{t+=num(a.rpe)*num(a.min);});return t;}
const weekLoad=mon=>{let t=0;for(let i=0;i<7;i++)t+=dayLoad(addDays(mon,i));return t;};
function acwr(){const t=today();let a=0,c=0,days=0;for(let i=0;i<28;i++){const l=dayLoad(addDays(t,-i));if(l>0)days++;c+=l;if(i<7)a+=l;}const chronic=c/4;if(days<8||chronic<=0)return null;return{r:a/chronic,a:a,c:chronic};}

/* ---- séances comptées ---- */
function weekCounts(mon){let done=0,planned=0,extra=0;
 ['lun','mar','mer','jeu','ven'].forEach((id,i)=>{const d=addDays(mon,i),L=S.logs[d]||{};const PP=progOf(d,id);if(PP.soir&&!S.skip[d])planned++;if(L.fin)done++;if(PP.run&&PP.run!=='wed'){planned++;if(L.run&&L.run.fin)done++;}});
 for(let i=0;i<7;i++)extra+=(S.acts[addDays(mon,i)]||[]).length;return{done:done,planned:planned,extra:extra};}
function totalLogged(){let n=0;Object.keys(S.logs).forEach(d=>{const L=S.logs[d];if(L.fin)n++;if(L.run&&L.run.fin)n++;});Object.keys(S.acts).forEach(d=>n+=S.acts[d].length);return n;}
function dayDone(d){const L=S.logs[d]||{};return !!(L.fin||(L.run&&L.run.fin)||(S.acts[d]&&S.acts[d].length));}

/* ---- poids / nutrition ---- */
function weightTrend(){const w=S.weights;if(!w.length)return null;const t=today();
 const avg=(a,b)=>{const x=w.filter(p=>p.d>=addDays(t,-b)&&p.d<=addDays(t,-a));return x.length?x.reduce((s,p)=>s+p.kg,0)/x.length:null;};
 const a1=avg(0,6),a0=avg(7,13);return{last:w[w.length-1],a1:a1,a0:a0,rate:(a1!==null&&a0!==null)?a1-a0:null};}
const nutriDay=d=>S.nutri[d]||(S.nutri[d]={kcal:0,p:0,c:0,f:0,water:0,sup:[]});
function nutriTargets(d){const rest=dayId(d)==='dim';const k=rest?S.set.kcalRest:S.set.kcal;return{kcal:k,p:S.set.prot,c:Math.round((k*.5)/4/5)*5,f:Math.round((k*.24)/9/5)*5,water:S.set.water};}

/* ---- estimation Hyrox ---- */
function hyroxEstimate(){const ids=['mer-skierg','mer-sledpush','mer-sledpull','mer-burpee','mer-row','mer-farmer','mer-lunges','mer-wb'];let tot=0,known=0;const rows=[];
 ids.forEach(id=>{const it=resolve(id);let t=it.tb||0,src='réf.';const h=(hist()[it.key]||[]).filter(x=>x.e.t);if(h.length){t=parseT(h[h.length-1].e.t);src='réel';known++;}else{const hb=hist();Object.keys(hb).filter(k=>k.indexOf(id+'::')===0).forEach(k=>{const l=hb[k].filter(x=>x.e.t);if(l.length){t=parseT(l[l.length-1].e.t);src='réel';known++;}});}
  rows.push({id:id,name:it.name,t:t,src:src});tot+=t;});
 let pace=330,psrc='défaut';let hl=[];Object.keys(hist()).filter(k=>k.indexOf('allure Hyrox')>-1).forEach(k=>{hist()[k].forEach(x=>{if(x.e.v)hl.push(x);});});hl.sort((a,b)=>a.date<b.date?-1:1);if(hl.length){pace=parseT(hl[hl.length-1].e.v);psrc='réel';}
 const run=pace*8,trans=150;return{rows:rows,sta:tot,run:run,pace:pace,psrc:psrc,total:tot+run+trans,known:known};}

/* ---- insights / initiatives ---- */
function insights(){const out=[];const t=today(),mon=mondayOf(t),id=dayId(t);
 if(t>=V2){const v=variantOf(t),w=((Math.floor(weeksBetween(V2,mondayOf(t)))%4)+4)%4+1;out.push({k:'info',i:'mountain',x:'Programme <b>variante '+v+'</b>, semaine '+w+'/4 — il change d\'exercices toutes les 4 semaines.'});}
 if(id==='jeu')out.push({k:'info',i:'bolt',x:'Épaules jeudi : pas d\'échec (bras, tractions et dips en rappel léger), pour rouler vendredi après-midi avec des avant-bras frais.'});
 if(id==='mar')out.push({k:'info',i:'bolt',x:'Jambes mardi : charge à fond, tu as 3 jours de récupération avant la moto.'});
 if(id==='lun'||id==='mar'||id==='mer')out.push({k:'info',i:'timer',x:'Cardio du jour : <b>'+EX[cardioAt(t,{lun:0,mar:1,mer:2}[id])].name+'</b>, allure facile, après la muscu.'});
 const vol=weekVolume(mon).sets,pl=plannedVolume(mon);const dn=daysBetween(mon,t);
 if(dn>=3)MUSCLES.forEach(m=>{const lo=MUSCLE_TGT[m][0];if(vol[m]<lo*.5&&pl[m]>0)out.push({k:'info',i:'chart',x:'Volume '+m+' faible cette semaine ('+vol[m].toFixed(1)+' séries). Objectif '+MUSCLE_TGT[m][0]+'–'+MUSCLE_TGT[m][1]+'.'});});
 let pr=0;Object.keys(hist()).forEach(k=>{const idx=k.split('::')[0];if(!EX[idx]||EX[idx].kind!=='lift')return;const it=resolve(idx,k.split('::')[1]);const h=hist()[k];const last=h[h.length-1];if(last&&daysBetween(last.date,t)<=7&&h.length>1&&isDone(last.e)){const b=prBest(it,last.date);const m=Math.max.apply(null,(last.e.sets||[]).filter(s=>s.d).map(s=>e1rm(it,s)).concat([0]));if(m>b)pr++;}});
 if(pr)out.push({k:'good',i:'trophy',x:pr+' record'+(pr>1?'s':'')+' battu'+(pr>1?'s':'')+' cette semaine — beau boulot.'});
 return out;}

/* ===================== ANIMATIONS DE MOUVEMENT (bonhomme SVG, calculé par cinématique) ===================== */
const dirv=(a,l)=>{const r=a*Math.PI/180;return[Math.sin(r)*l,-Math.cos(r)*l];};
const vadd=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const ease=x=>x*x*(3-2*x);
function ik2(A,B,l1,l2,pick){let dx=B[0]-A[0],dy=B[1]-A[1],d=Math.hypot(dx,dy)||1;d=Math.min(d,l1+l2-.01);const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
 const ux=dx/Math.hypot(dx,dy||1e-9),uy=dy/Math.hypot(dx,dy||1e-9),mx=A[0]+ux*a,my=A[1]+uy*a;const c1=[mx-uy*h,my+ux*h],c2=[mx+uy*h,my-ux*h];return pick(c1,c2)?c1:c2;}
const DEF={th:180,sh:180,to:0,ua:180,fa:180,hd:0,rise:0};
function norm(p,pd){const q=Object.assign({},DEF,p);if(q.th2===undefined)q.th2=q.th;if(q.sh2===undefined)q.sh2=q.sh;const rt=pd.root||{x:50};if(q.rx===undefined)q.rx=rt.x;if(q.ry===undefined)q.ry=rt.y===undefined?84:rt.y;return q;}
function mixp(a,b,f){const o={};for(const k in a)o[k]=a[k]+(b[k]-a[k])*f;return o;}
function sideJ(p,pd){const K=dirv(p.th,17),F=vadd(K,dirv(p.sh,17)),N=dirv(p.to,22),H=vadd(N,dirv(p.to+p.hd,7)),E=vadd(N,dirv(p.ua,12)),W=vadd(E,dirv(p.fa,11)),K2=dirv(p.th2,17),F2=vadd(K2,dirv(p.sh2,17));
 const J={P:[0,0],K:K,F:F,N:N,H:H,E:E,W:W,K2:K2,F2:F2};const rk=pd.root.k;let off;
 if(rk==='F')off=[p.rx-F[0],(p.ry-p.rise)-F[1]];else off=[p.rx-J[rk][0],p.ry-J[rk][1]];
 for(const k in J)J[k]=vadd(J[k],off);
 const gr=rk==='F';J.T=gr?[J.F[0]+6,87]:vadd(J.F,[6,3]);J.T2=gr?[J.F2[0]+6,87]:vadd(J.F2,[6,3]);return J;}
function sideD(J){const f=v=>v[0].toFixed(1)+' '+v[1].toFixed(1);return'M'+f(J.F2)+'L'+f(J.K2)+'L'+f(J.P)+'L'+f(J.K)+'L'+f(J.F)+'M'+f(J.F)+'L'+f(J.T)+'M'+f(J.F2)+'L'+f(J.T2)+'M'+f(J.P)+'L'+f(J.N)+'M'+f(J.N)+'L'+f(J.E)+'L'+f(J.W);}
function frontJ(p,pd){const dy=p.dy||0,N=[50,32+dy],P=[50,54+dy],H=[50,26+dy],SL=[43,33+dy],SR=[57,33+dy];let HL=[47,54+dy],HR=[53,54+dy];
 let KL=[46,71+dy],KR=[54,71+dy],FL=[45,88+dy],FR=[55,88+dy];if(pd.seat){KL=[42,64];KR=[58,64];FL=[42,88];FR=[58,88];HL=[46,56];HR=[54,56];P[1]=56;}
 let ER,WR,EL,WL;
 if(p.hx!==undefined){WR=[50+p.hx,p.hy];WL=[50-p.hx,p.hy];ER=ik2(SR,WR,12,11,(a,b)=>a[0]>b[0]);EL=ik2(SL,WL,12,11,(a,b)=>a[0]<b[0]);}
 else{ER=vadd(SR,[Math.sin(p.u*Math.PI/180)*12,Math.cos(p.u*Math.PI/180)*12]);WR=vadd(ER,[Math.sin(p.f*Math.PI/180)*11,Math.cos(p.f*Math.PI/180)*11]);EL=[100-ER[0],ER[1]];WL=[100-WR[0],WR[1]];}
 return{H:H,N:N,P:P,SL:SL,SR:SR,HL:HL,HR:HR,KL:KL,KR:KR,FL:FL,FR:FR,EL:EL,ER:ER,WL:WL,WR:WR,W:WR,F:FR,front:true};}
function frontD(J){const f=v=>v[0].toFixed(1)+' '+v[1].toFixed(1);return'M'+f(J.SL)+'L'+f(J.SR)+'M'+f(J.N)+'L'+f(J.P)+'M'+f(J.HL)+'L'+f(J.KL)+'L'+f(J.FL)+'M'+f(J.HR)+'L'+f(J.KR)+'L'+f(J.FR)+'M'+f(J.SL)+'L'+f(J.EL)+'L'+f(J.WL)+'M'+f(J.SR)+'L'+f(J.ER)+'L'+f(J.WR);}

/* cycle spécial : vélo, course */
function bikeJ(t){const P=[44,58],a=t*2*Math.PI,C=[50,82],pe=[C[0]+7*Math.cos(a),C[1]+7*Math.sin(a)],pe2=[C[0]-7*Math.cos(a),C[1]-7*Math.sin(a)];
 const K=ik2(P,pe,17,17,(x,y)=>x[0]>y[0]),K2=ik2(P,pe2,17,17,(x,y)=>x[0]>y[0]),N=vadd(P,dirv(38,22)),HB=[72,50],E=ik2(N,HB,12,11,(x,y)=>x[1]>y[1]);
 return{P:P,K:K,F:pe,K2:K2,F2:pe2,N:N,H:vadd(N,dirv(38,7)),E:E,W:HB,T:vadd(pe,[3,0]),T2:vadd(pe2,[3,0])};}
function runJ(t){const a=t*2*Math.PI,P=[50,50+2*Math.cos(2*a)];const th=s=>180-40*Math.sin(s),sh=(s,ph)=>th(s)+35+30*Math.sin(s);
 const p={th:th(a),sh:sh(a),th2:th(a+Math.PI),sh2:sh(a+Math.PI),to:8,ua:180+35*Math.sin(a),fa:180+35*Math.sin(a)-85,hd:0,rise:0,rx:P[0],ry:P[1]};
 const J=sideJ(p,{root:{k:'P'}});return J;}

function capd(a,b,w1,w2){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,r1=w1/2,r2=w2/2,f=n=>n.toFixed(1);
 const p1=[a[0]+nx*r1,a[1]+ny*r1],p2=[b[0]+nx*r2,b[1]+ny*r2],p3=[b[0]-nx*r2,b[1]-ny*r2],p4=[a[0]-nx*r1,a[1]-ny*r1];
 return'M'+LC(p1)+'L'+LC(p2)+'A'+f(r2)+' '+f(r2)+' 0 0 0 '+LC(p3)+'L'+LC(p4)+'A'+f(r1)+' '+f(r1)+' 0 0 0 '+LC(p1)+'Z';}
function capb(A,B,w1,w2,bl){const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,r1=w1/2,r2=w2/2,rm=(r1+r2)/2*(bl||1.18),f=n=>n.toFixed(1);
 const m=[(A[0]+B[0])/2,(A[1]+B[1])/2],k=2*rm-(r1+r2)/2;
 const p1=[A[0]+nx*r1,A[1]+ny*r1],p2=[B[0]+nx*r2,B[1]+ny*r2],p3=[B[0]-nx*r2,B[1]-ny*r2],p4=[A[0]-nx*r1,A[1]-ny*r1];
 const c1=[m[0]+nx*k,m[1]+ny*k],c2=[m[0]-nx*k,m[1]-ny*k];
 return'M'+LC(p1)+'Q'+LC(c1)+' '+LC(p2)+'A'+f(r2)+' '+f(r2)+' 0 0 0 '+LC(p3)+'Q'+LC(c2)+' '+LC(p4)+'A'+f(r1)+' '+f(r1)+' 0 0 0 '+LC(p1)+'Z';}
const dot=(c,r)=>capd([c[0]-.01,c[1]],[c[0]+.01,c[1]],r*2,r*2);
function bodyD(J){const o={};
 if(J.front){const sh=[J.SL,J.SR,J.HR,J.HL].map(LC);
  o.tor='M'+sh[0]+'L'+sh[1]+'L'+sh[2]+'L'+sh[3]+'Z';
  o.lg2t=capb(J.HL,J.KL,7,5.4);o.lg2s=capb(J.KL,J.FL,5.4,3.6,1.3);o.lg2f=capd(J.FL,[J.FL[0]-3.5,J.FL[1]+2],3.4,3);
  o.lgt=capb(J.HR,J.KR,7,5.4);o.lgs=capb(J.KR,J.FR,5.4,3.6,1.3);o.lgf=capd(J.FR,[J.FR[0]+3.5,J.FR[1]+2],3.4,3);
  o.nk=capd(J.N,lerp(J.N,J.H,.8),3.4,3.2);
  o.ua2=capb(J.SL,J.EL,4.6,3.6);o.fa2=capd(J.EL,J.WL,3.6,2.7);o.hd2=dot(J.WL,2.6);
  o.ua=capb(J.SR,J.ER,4.6,3.6);o.fa=capd(J.ER,J.WR,3.6,2.7);o.hd=dot(J.WR,2.6);return o;}
 o.tor=capd(J.P,J.N,9,11);
 o.lg2t=capb(J.P,J.K2,7.4,5.4);o.lg2s=capb(J.K2,J.F2,5.4,3.5,1.3);o.lg2f=capd(J.F2,J.T2,3.4,2.8);
 o.lgt=capb(J.P,J.K,7.8,5.6);o.lgs=capb(J.K,J.F,5.6,3.6,1.3);o.lgf=capd(J.F,J.T,3.6,2.8);
 o.nk=capd(J.N,lerp(J.N,J.H,.8),3.4,3.2);
 o.ua=capb(J.N,J.E,4.8,3.8);o.fa=capb(J.E,J.W,4.2,2.8,1.2);o.hd=dot(J.W,2.7);return o;}
function drawFig(svg,now){const pat=svg.dataset.pat,pd=PATS[pat];if(!pd)return;const t=((now/1000)/pd.dur)%1;const J=jointsAt(pd,t);
 if(!svg._e){svg._e={};BODY.concat(['fg','fh','hr','m1','m2','e1','e2','c1','c2']).forEach(k=>{svg._e[k]=svg.querySelector('.b-'+k)||svg.querySelector('.'+k);});}
 const E=svg._e;
 if(!svg.dataset.g){svg.dataset.g='1';if(!pd.fn){const n=pd.poses.length;let d='';[0,Math.floor(n/2)].forEach(i=>{const q=parts(jointsAt(pd,i/n+1e-9));d+=q.legs+q.torso+q.arms;});E.fg.setAttribute('d',d);}}
 const bd=bodyD(J);BODY.forEach(k=>{if(bd[k]){E[k].setAttribute('d',bd[k]);E[k].style.display='';}else E[k].style.display='none';});
 E.tor.style.strokeWidth=J.front?'4':'1.5';
 E.fh.setAttribute('cx',J.H[0].toFixed(1));E.fh.setAttribute('cy',J.H[1].toFixed(1));
 const hx=J.H[0],hy=J.H[1];E.hr.setAttribute('d','M'+(hx-4.9).toFixed(1)+' '+(hy+.3).toFixed(1)+'A4.9 4.9 0 0 1 '+(hx+4.9).toFixed(1)+' '+(hy-.8).toFixed(1)+'Q'+(hx+1).toFixed(1)+' '+(hy-2.2).toFixed(1)+' '+(hx-4.9).toFixed(1)+' '+(hy+.3).toFixed(1)+'Z');
 const mp=musclePts(MU[pat],J);['m1','m2'].forEach((k,i)=>{const e=E[k];if(mp[i]){e.setAttribute('cx',mp[i][0].toFixed(1));e.setAttribute('cy',mp[i][1].toFixed(1));e.style.display='';}else e.style.display='none';});
 const g=eqGeom(svg.dataset.eq,J,pd);['e1','e2'].forEach((k,i)=>{const e=E[k];if(g.p[i]){e.setAttribute('d',g.p[i]);e.style.display='';}else e.style.display='none';});
 ['c1','c2'].forEach((k,i)=>{const e=E[k];if(g.c[i]){e.setAttribute('cx',g.c[i][0].toFixed(1));e.setAttribute('cy',g.c[i][1].toFixed(1));e.setAttribute('r',g.c[i][2]);e.style.display='';}else e.style.display='none';});}
let figRun=false;
function figLoop(now){const l=document.querySelectorAll('svg.fig');if(!l.length||document.hidden){figRun=false;return;}l.forEach(s=>drawFig(s,now));requestAnimationFrame(figLoop);}

 d.innerHTML='<svg width="0" height="0"><defs>'+g('gSkin','#f6cfae','#c58a66')+g('gSkinD','#c9a082','#8f654b')+g('gShirt','#e9eef1','#8d9ca6')+g('gShort','#6d7b85','#343e46')+g('gShortD','#4d5a63','#2a3238')+g('gShoe','#ffffff','#c5cdd0')+'</defs></svg>';document.body.appendChild(d);}

 [/seal row|banc de rowing/i,['Banc : règle la hauteur pour que la barre pende bras tendus sans toucher le sol (ajoute des disques de réhausse si besoin) et touche le banc en haut du mouvement.','Poitrine en haut du coussin, tête dans l\'axe de la barre, jambes allongées ou bloquées selon le banc.','Prise un peu plus large que les épaules, coudes à ~45° du corps, tire vers le haut des côtes.','Pas d\'élan possible : prévois environ 15–20 % de moins de charge que ton rowing barre classique.']],

 [/leg curl|nordic/i,['Dossier : l\'axe de rotation de la machine doit être aligné avec ton genou (ligne qui passe par l\'articulation).','Rouleau de chevilles : juste au-dessus des talons (au-dessus du tendon d\'Achille), pas sur les mollets.','Cale-cuisses : serré pour bloquer les cuisses. Hanches collées au siège, ne les décolle pas.','Technogym : règle aussi la position de départ pour partir jambes presque tendues, sans douleur derrière le genou.']],

const FT={"chest":["Siège : poignées à hauteur du milieu de la poitrine, dos plaqué, omoplates serrées, pieds au sol.","Pousse sans verrouiller les coudes, reviens en 2–3 s jusqu'à sentir l'étirement des pecs, sans lâcher la tension."],"decl":["Dos plaqué, fesses calées, poignées en bas de pecs. Pousse vers le bas/avant en gardant les épaules basses.","Mouvement plus court que le couché : ne cherche pas l'étirement extrême à l'épaule."],"inc":["Siège : poignées au niveau du haut de la poitrine, dos plaqué, épaules basses.","Pousse en arc vers le haut/avant, coudes à ~45° du buste, reviens en 2–3 s sans rebond."],"fly":["Siège : poignées à hauteur de poitrine (coudes à peine plus bas que les épaules), dos plaqué.","Rapproche les bras en serrant les pecs 1 s, ouvre sans aller trop loin derrière le plan des épaules."],"rear":["Siège : poignées à hauteur d'épaules, poitrine contre le coussin, coudes légèrement fléchis.","Tire en arrière en menant avec les coudes, serre les omoplates 1 s, charge légère."],"shp":["Siège : poignées à hauteur du menton/épaules au départ, dos plaqué, abdos serrés.","Pousse sans cambrer ni verrouiller les coudes, reviens en 2 s jusqu'aux oreilles."],"lat":["Siège : l'axe de rotation aligné avec l'épaule, coudes sous les coussinets, dos plaqué.","Monte en menant avec les coudes jusqu'à l'horizontale, épaules basses, descente 2–3 s. Charge modérée, pas d'élan."],"tri":["Siège/hauteur : coudes calés (pas d'avance du buste), l'axe aligné avec le coude.","Étends complètement, serre 1 s, remonte jusqu'à ~90° de coude sans lâcher la tension."],"dip":["Siège : hauteur pour que les poignées soient à hauteur d'épaules/pectoraux, dos plaqué.","Pousse sans lever les épaules vers les oreilles, coudes proches du corps pour cibler les triceps."],"bi":["Siège : coudes alignés avec l'axe de la machine, aisselles contre le coussin, dos plaqué.","Ramène les poignées en contractant, descends en 3 s sans verrouiller le coude en bas ni balancer le buste."],"pd":[" mplet), monte sur la pointe, serre 1 s. Jamais de rebond."],"hip":["Dos sur le support, ceinture/barre sur le bassin, pieds à largeur d'épaules, tibias verticaux en haut.","Pousse dans les talons, bassin en rétroversion en haut, serre les fessiers 1 s, descends en contrôle."],"bx":["Coussin à hauteur du haut du bassin pour pouvoir fléchir à la hanche, jambes calées.","Descends dos neutre, remonte jusqu'à l'alignement sans hyper-extension."],"ab":["Siège : la poitrine contre le coussin, axe aligné avec le bas du ventre.","Enroule le buste en rapprochant côtes et bassin, souffle sur l'effort, retour lent."]};

function tipsFor(name){for(const r of TIPS){if(r[0].test(name||''))return r[1];}return null;}
function tipHTML(name,open){const t=tipsFor(name);if(!t)return'';
 return'<details class="tip"'+(open?' open':'')+'><summary>Réglages machine</summary><ul>'+t.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>';}

/* ===================== BISETS / SUPERSETS / TRISETS ===================== */
const ssList=d=>{const L=S.logs[d];return(L&&L.ss)||[];};
function ssGroups(d,ids){const ss=ssList(d),g=[];let cur=[];ids.forEach((id,i)=>{cur.push(id);if(!(ss.includes(id)&&i<ids.length-1)){g.push(cur);cur=[];}});if(cur.length)g.push(cur);return g;}
const ssLift=id=>!EX[id].kind||EX[id].kind==='lift';
const ssOk=(a,b)=>ssLift(a)&&ssLift(b);
const ssLabel=n=>n===2?'BISET':n===3?'TRISET':'CIRCUIT';
function ssBtn(d,id,linked){return'<button class="ssb'+(linked?' on':'')+'" data-a="sslink" data-d="'+d+'" data-id="'+id+'">'+(linked?'⛓ Dissocier':'⛓ Enchaîner avec le suivant')+'</button>';}
function ssBlock(ids,d){const g=ssGroups(d,ids);let h='';
 g.forEach((grp,gi)=>{let inner='';grp.forEach((x,i)=>{inner+=exCard(x,d);if(i<grp.length-1)inner+=ssBtn(d,x,true);});
  if(grp.length>1)h+='<div class="ssg"><div class="ssh">'+ssLabel(grp.length)+' · '+grp.map(x=>esc(itFor(d,x).name)).join(' → ')+'</div><div class="sub" style="margin:0 0 6px">Une série de chaque exercice sans repos, puis repos complet. Répète pour toutes les séries.</div>'+inner+'</div>';
  else h+=inner;
  if(gi<g.length-1){const a=grp[grp.length-1],b=g[gi+1][0];if(ssOk(a,b))h+=ssBtn(d,a,false);}});
 return h;}
function ssBar(d,SO){const has=ssList(d).length>0;
 return'<div class="ssbar"><div class="sub" style="flex:1"><b>Biset / superset</b> : enchaîne 2 exercices sans repos, puis repose-toi. Gain de temps et plus d\'intensité.</div><button class="btn ghost sm" data-a="sssuggest" data-d="'+d+'">Proposer</button>'+(has?'<button class="btn ghost sm" data-a="ssclear" data-d="'+d+'">Tout retirer</button>':'')+'</div>';}
const SS_ANTA=[['Pecs','Dos'],['Biceps','Triceps']];
function ssPair(a,b){if(!ssOk(a,b))return false;const A=EX[a],B=EX[b];const anta=SS_ANTA.some(p=>(p[0]===A.m&&p[1]===B.m)||(p[1]===A.m&&p[0]===B.m));
 if(anta)return true;return A.m===B.m&&!(A.cat==='compound'&&B.cat==='compound');}
function ssSuggest(d,SO){const out=[];SO.blocks.forEach(b=>{const ids=b.ex;for(let i=0;i<ids.length-1;){if(ssPair(ids[i],ids[i+1])){out.push(ids[i]);i+=2;}else i++;}});return out;}
function ssTimer(d,id,it){const P=progOf(d),SO=soirOf(P,d);let grp=null;
 if(SO)SO.blocks.forEach(b=>{if(b.ex.includes(id))ssGroups(d,b.ex).forEach(g=>{if(g.includes(id))grp=g;});});
 if(grp&&grp.length>1){const i=grp.indexOf(id);if(i<grp.length-1){tStart(15);toast('Enchaîne : '+itFor(d,grp[i+1]).name);return;}const r=Math.max.apply(null,grp.map(x=>itFor(d,x).rest||0));if(r)tStart(r);return;}
 if(it.rest)tStart(it.rest);}

function stpIn(f,id,d,i,ph,val,mode){const a=' data-id="'+id+'" data-d="'+d+'" data-n="'+i+'" data-f="'+f+'"';
 return'<div class="stp"><button type="button" class="sb" data-a="stp" data-dir="-1"'+a+'>−</button><input class="inp" inputmode="'+mode+'" placeholder="'+ph+'" value="'+(val!==undefined?esc(val):'')+'" data-i="set"'+a+'><button type="button" class="sb" data-a="stp" data-dir="1"'+a+'>+</button></div>';}
function exAllDone(d,id){const it=itFor(d,id),e=getEx(d,id)||{sets:[]};
 if(it.kind==='lift'||it.kind==='time'){const n=setsFor(it,d);let c=0;(e.sets||[]).forEach(s=>{if(s&&s.d)c++;});return c>=n&&n>0;}
 return !!e.d;}
function exProg(d,id){const it=itFor(d,id),e=getEx(d,id)||{sets:[]};
 if(it.kind==='lift'||it.kind==='time'){const n=Math.max(setsFor(it,d),(e.sets||[]).length);let c=0;(e.sets||[]).forEach(s=>{if(s&&s.d)c++;});return[c,n];}
 return[e.d?1:0,1];}
function sessProg(d,SO){let a=0,b=0;SO.blocks.forEach(bl=>bl.ex.forEach(id=>{const p=exProg(d,id);a+=p[0];b+=p[1];}));return[a,b];}
function fillEx(d,id){const it=itFor(d,id),e=ensureEx(d,it);
 if(it.kind==='lift'||it.kind==='time'){const isT=it.kind==='time',tg=isT?timeTarget(it,d):liftTarget(it,d);const n=Math.max(setsFor(it,d),e.sets.length);dense(e.sets,n-1);
  for(let i=0;i<n;i++){const s=e.sets[i];if(s.d)continue;if(s.w===undefined||s.w==='')s.w=isT?String(Math.round(tg.t)):String(tg.w);if(!isT&&(s.r===undefined||s.r===''))s.r=String(tg.r);s.d=true;}}
 else if(!e.d){const tg=it.kind==='carry'||it.kind==='station'?loadTarget(it,d):null;if(it.kind==='carry'&&(e.v===undefined||e.v===''))e.v=String(tg.w);if(it.kind==='station'&&it.base!==undefined&&(e.v===undefined||e.v===''))e.v=String(tg.w);e.d=true;}}

function barsSVG(vals,labels,color,fmt){const W=320,H=120,n=vals.length,mx=Math.max.apply(null,vals.concat([1])),bw=W/n;let s='<svg viewBox="0 0 '+W+' '+(H+18)+'" width="100%">';
 vals.forEach((v,i)=>{const h=Math.round(v/mx*(H-16));const x=i*bw+bw*.15;s+='<rect x="'+x+'" y="'+(H-h)+'" width="'+(bw*.7)+'" height="'+h+'" rx="3" fill="'+(color)+'" opacity="'+(i===n-1?1:.65)+'"/>';
  if(v>0)s+='<text x="'+(x+bw*.35)+'" y="'+(H-h-3)+'" font-size="8.5" text-anchor="middle" fill="#8FA0A8">'+(fmt?fmt(v):Math.round(v))+'</text>';
  s+='<text x="'+(x+bw*.35)+'" y="'+(H+12)+'" font-size="8.5" text-anchor="middle" fill="#8FA0A8">'+labels[i]+'</text>';});
 return s+'</svg>';}
function lineSVG(pts,target){if(pts.length<2)return'<div class="sub">Ajoute au moins 2 pesées pour voir la courbe.</div>';const W=320,H=130;
 const ys=pts.map(p=>p.y).concat(target?[target]:[]);let mn=Math.min.apply(null,ys)-1,mx=Math.max.apply(null,ys)+1;const x0=pts[0].x,x1=pts[pts.length-1].x||1;
 const X=x=>16+(x-x0)/((x1-x0)||1)*(W-32),Y=y=>H-14-(y-mn)/(mx-mn)*(H-30);
 let s='<svg viewBox="0 0 '+W+' '+(H+8)+'" width="100%">';
 if(target)s+='<line x1="16" x2="'+(W-16)+'" y1="'+Y(target)+'" y2="'+Y(target)+'" stroke="#5C8253" stroke-dasharray="4 4"/><text x="'+(W-16)+'" y="'+(Y(target)-3)+'" text-anchor="end" font-size="8.5" fill="#5C8253">objectif '+target+' kg</text>';
 s+='<polyline fill="none" stroke="#C1531E" stroke-width="2.5" points="'+pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')+'"/>';
 pts.forEach((p,i)=>{s+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="#C1531E"/>';if(i===0||i===pts.length-1)s+='<text x="'+X(p.x)+'" y="'+(Y(p.y)-7)+'" text-anchor="middle" font-size="9" fill="#EEF1F0">'+p.y+'</text>';});
 return s+'</svg>';}

 let h='<div class="card"><div class="rowb" style="margin-bottom:8px"><h3 class="d" style="margin:0">Check-in forme</h3><span class="sub">1 = bas · 5 = top</span></div>';

/* ===================== SYNC optionnelle (capacité db de l'artefact) : sauvegarde + téléphone/ordinateur ===================== */
const SY={col:null,timer:null,busy:false,on:false,hs:{},ts:{}};
const SY_KEYS=['logs','acts','ready','nutri','skip'];
function syChunks(){const c={},meta={weights:S.weights,subs:S.subs,set:S.set};c.meta=meta;
 SY_KEYS.forEach(k=>{const o=S[k]||{};Object.keys(o).forEach(d=>{const m=d.slice(0,7);(c[m]=c[m]||{});(c[m][k]=c[m][k]||{})[d]=o[d];});});return c;}
function syApply(id,o){if(id==='meta'){if(o.weights)S.weights=o.weights;if(o.subs)S.subs=o.subs;if(o.set)S.set=Object.assign(defState().set,o.set);return;}
 SY_KEYS.forEach(k=>{S[k]=S[k]||{};Object.keys(S[k]).forEach(d=>{if(d.slice(0,7)===id)delete S[k][d];});Object.assign(S[k],(o[k]||{}));});}
function scheduleSync(){if(!SY.on)return;clearTimeout(SY.timer);SY.timer=setTimeout(syPush,1800);}
async function syPush(){if(!SY.on||SY.busy)return;SY.busy=true;
 try{const ch=syChunks();for(const id of Object.keys(ch)){const j=JSON.stringify(ch[id]);if(SY.hs[id]===j)continue;const t=Date.now();await SY.col.doc(id).set({t:t,j:j});SY.hs[id]=j;SY.ts[id]=t;}
  const el=document.getElementById('sv');if(el&&saveOK){el.textContent=el.textContent.replace(/ ☁$/,'')+' ☁';}}
 catch(e){console.warn('sync',e&&e.code);}SY.busy=false;}
async function initSync(){try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const uid=await user.id();if(!uid)return;
 SY.col=db.doc('data/users/'+uid+'/hx').collection('c');
 const snap=await SY.col.get();const local=syChunks();let adopted=false;
 let lastEdit=0;try{lastEdit=+localStorage.getItem('hyrox_lastedit')||0;}catch(e){}
 snap.docs.forEach(d=>{const r=d.data();if(!r||!r.j)return;const id=d.id;const lj=JSON.stringify(local[id]||{});
  SY.hs[id]=r.j;SY.ts[id]=r.t;
  if(lj===r.j)return;
  if(r.t>lastEdit){try{syApply(id,JSON.parse(r.j));adopted=true;SY.hs[id]=r.j;}catch(e){}}else{delete SY.hs[id];}});
 SY.on=true;
 if(adopted){H=null;try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}render(true);toast('Données synchronisées ☁');}
 syPush();}catch(e){console.warn('sync init',e&&(e.code||e.message));}}

  if(SO.note)out.push(SO.note);return out.join('\n').trim();}
 function icuEvents(n){const ev=[];for(let i=0;i<n;i++){const d=addDays(today(),i);let P,SO;try{P=progOf(d);SO=soirOf(P,d);}catch(e){continue;}if(!SO||!SO.blocks||!SO.blocks.length)continue;
   ev.push({category:'WORKOUT',type:'WeightTraining',start_date_local:d+'T18:30:00',name:SO.title,description:icuDesc(d,SO),moving_time:(SO.min||60)*60,external_id:'hx-'+d});}
  return ev;}
 let busy=false;
 async function icuPush(n,quiet){const c=cfg();if(!c.key){if(!quiet)toast('Renseigne ta clé API Intervals.icu dans Réglages');return false;}
  if(busy)return false;busy=true;
  try{const ev=icuEvents(n||10);if(!ev.length){if(!quiet)toast('Aucune séance à envoyer');return false;}
   const body=JSON.stringify(ev);if(quiet&&c.hash===body.length+':'+hashS(body)&&Date.now()-(c.last||0)<6*3600e3)return true;
   const r=await fetch('https://intervals.icu/api/v1/athlete/'+encodeURIComponent(c.id||'0')+'/events/bulk?upsert=true',{method:'POST',headers:{'Authorization':'Basic '+btoa('API_KEY:'+c.key),'Content-Type':'application/json'},body:body});
   if(!r.ok){const t=await r.text().catch(()=>'');throw new Error(r.status===401||r.status===403?'clé ou ID Intervals.icu refusé':('erreur '+r.status+' '+t.slice(0,80)));}
   setCfg({last:Date.now(),hash:body.length+':'+hashS(body)});if(!quiet)toast(ev.length+' séance(s) envoyée(s) à Intervals.icu ✓');renderIcuState();return true;}
  catch(e){if(!quiet)toast('Intervals.icu : '+(e.message==='Failed to fetch'?'connexion bloquée (réseau ou page non autorisée)':e.message));return false;}
  finally{busy=false;}}
 function hashS(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;}
 function renderIcuState(){const el=document.getElementById('icust');if(!el)return;const c=cfg();el.textContent=c.last?'Dernier envoi : '+new Date(c.last).toLocaleString('fr-FR'):'Jamais envoyé';}
 Object.assign(A,{
  icuSave:()=>{const id=(document.getElementById('icuid').value||'').trim(),k=(document.getElementById('icukey').value||'').trim();const o={id:id};if(k&&!/^•+$/.test(k))o.key=k;setCfg(o);toast('Enregistré sur cet appareil');render(true);},
  icuAuto:()=>{setCfg({auto:!cfg().auto});render(true);},
  icuSend:()=>{icuPush(10,false);},
  icuDel:()=>{try{localStorage.removeItem(CK);}catch(e){}render(true);toast('Clé effacée');},
  icuCopy:()=>{const d=today(),SO=soirOf(progOf(d),d);if(!SO){toast('Pas de séance aujourd\'hui');return;}const t=SO.title+'\n\n'+icuDesc(d,SO);
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Séance copiée — colle-la dans Intervals.icu')).catch(()=>toast('Copie impossible'));else toast('Copie impossible');}});
 const _vs=VIEWS.set;
 VIEWS.set=function(){let h=_vs();const c=cfg();
  const card='<div class="card"><h3 class="d">Garmin via Intervals.icu</h3><div class="sub" style="margin-bottom:8px">Envoie tes séances à venir (10 jours) dans le calendrier Intervals.icu, qui les pousse sur ta montre Garmin si la synchro Garmin est activée dans Intervals.icu (Settings ▸ Garmin). Clé : Intervals.icu ▸ Settings ▸ Developer Settings ▸ API key. Elle reste uniquement sur cet appareil.</div>'
   +'<div class="row" style="gap:6px;margin-bottom:6px"><input class="inp" id="icuid" placeholder="ID athlète (ex : i123456) — facultatif" value="'+esc(c.id||'')+'"></div>'
   +'<div class="row" style="gap:6px;margin-bottom:8px"><input class="inp" id="icukey" type="password" placeholder="Clé API" value="'+(c.key?'••••••••••':'')+'"><button class="btn sm" data-a="icuSave">OK</button>'+(c.key?'<button class="btn ghost sm" data-a="icuDel">Effacer</button>':'')+'</div>'
   +'<div class="row wrap" style="gap:6px"><button class="chip'+(c.auto?' on':'')+'" data-a="icuAuto">Envoi automatique</button><button class="btn sm" data-a="icuSend">Envoyer maintenant</button><button class="btn ghost sm" data-a="icuCopy">Copier la séance du jour</button></div>'
   +'<div class="sub" id="icust" style="margin-top:8px">'+(c.last?'Dernier envoi : '+esc(new Date(c.last).toLocaleString('fr-FR')):'Jamais envoyé')+'</div></div>';
  const k='<div class="card"><h3 class="d">Sauvegarde</h3>';return h.includes(k)?h.replace(k,card+k):h+card;};
 /* envoi auto : à l'ouverture et après modification de la séance */
 let tm=null;const _sv=save;save=function(){const r=_sv.apply(this,arguments);try{if(cfg().auto&&cfg().key){clearTimeout(tm);tm=setTimeout(()=>icuPush(10,true),20000);}}catch(e){}return r;};
 setTimeout(()=>{try{if(cfg().auto&&cfg().key)icuPush(10,true);}catch(e){}},4000);
})();

boot();
